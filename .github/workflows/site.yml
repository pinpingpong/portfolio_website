# Keeps the site and the AI Twin index in step with content/projects/*.md.
#  - check: fails if index.html / projects/*.html / sitemap.xml were not rebuilt
#           after a content change (run: python3 scripts/build_site.py)
#  - index: rebuilds the Pinecone "website" namespace on every push to main that
#           touches site content. The "working-style" namespace is never touched
#           here, because how_i_work.md is local-only and absent in CI.
name: Site content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "index.html"
      - "resume.html"
      - "projects/**"
      - "scripts/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "content/**"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: site-index
  cancel-in-progress: false   # never interrupt a namespace wipe + upload halfway

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "markdown>=3.7,<4" "pyyaml>=6,<7"
      - run: python scripts/build_site.py --check

  index:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "markdown>=3.7,<4" "pyyaml>=6,<7" "pinecone>=7,<8" "google-genai>=1.47,<2"
      - name: Rebuild AI Twin "website" namespace
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$PINECONE_API_KEY" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::PINECONE_API_KEY / GEMINI_API_KEY repo secrets not set; skipping index rebuild"
            exit 0
          fi
          python scripts/build_public_index.py
